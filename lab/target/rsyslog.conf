# Escribe los eventos de autenticación en el formato clásico de syslog
# (el que Centinela entiende) dentro de un volumen compartido.
module(load="imuxsock")
$FileCreateMode 0644
$DirCreateMode 0755
$ActionFileDefaultTemplate RSYSLOG_TraditionalFileFormat
auth,authpriv.*   /var/log/ssh-lab/auth.log
